[project]
name = "delera"
version = "0.1.0"
description = "Deep Learning-based Risk Assessment, a framework designed to identify and classify operational faults in the Franka Emika Panda manipulator using spatio-temporal deep learning models."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "bagpy==0.5",
    "matplotlib==3.8.0",
    "numpy==1.24.1",
    "pandas==1.3.5",
    "scikit-learn==1.3.1",
    "seaborn==0.13.0",
    "torch==2.1.0",
    "torch-geometric==2.3.1",
    "tqdm==4.66.1",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu118", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true